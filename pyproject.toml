[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nuosc"
version = "0.1.0"
description = "Three-flavour neutrino oscillations in vacuum and matter (NuFast), with T2K, NOvA, DUNE and Hyper-K far-detector spectra"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Vanessa Cerrone" }]
dependencies = [
    "numpy>=1.21",
    "matplotlib>=3.5",
    "SciencePlots>=2.0",
    "jupyter",
    "ipykernel",
]

[project.optional-dependencies]
root = ["uproot>=5"]          # only needed to re-read the original ROOT files

[tool.setuptools]
packages = ["nuosc"]
